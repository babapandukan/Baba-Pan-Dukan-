<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baba Pan Dukan</title><style>
body{margin:0;font-family:Arial;background:#f6f6f6;color:#222}header{background:#fff;padding:12px;position:sticky;top:0}.top{display:flex;justify-content:space-between;font-weight:bold;font-size:20px}.green{color:#18a64a}button{border:0;border-radius:9px;padding:10px;background:#18a64a;color:#fff;font-weight:bold}.search{box-sizing:border-box;width:100%;margin-top:12px;padding:13px;border:1px solid #ddd;border-radius:10px}.hero{margin:14px;padding:20px;background:#dff7e7;border-radius:16px}.section{padding:0 14px}.cats{display:flex;gap:10px;overflow:auto}.cat{background:#fff;padding:14px;min-width:85px;border-radius:12px;text-align:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-bottom:30px}.card{background:#fff;border-radius:14px;padding:10px}.card img{width:100%;height:125px;object-fit:cover;border-radius:10px}.add{width:100%;margin-top:8px;background:#fff;color:#18a64a;border:1px solid #18a64a}.name{font-weight:bold;margin-top:8px}.price{font-weight:bold;margin-top:5px}#cart{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:flex-end}.sheet{background:#fff;width:100%;padding:18px;border-radius:20px 20px 0 0}.row{padding:10px;background:#f3f3f3;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between}.qty button{padding:5px 9px}
</style></head><body><header><div class="top">🟢 <span><span class="green">Baba</span> Pan Dukan</span><button onclick="openCart()">🛒 <span id="count">0</span></button></div><input id="search" class="search" placeholder="Search products..." oninput="render()"></header><div class="hero"><h2>⚡ Fast Local Delivery</h2><p>Baba Pan Dukan • Mangobander, Jamui</p></div><section class="section"><h3>Shop by category</h3><div class="cats" id="cats"></div><h3>Popular products</h3><div class="grid" id="products"></div></section><section class="section" style="padding-bottom:20px"><div style="background:#fff;padding:16px;border-radius:14px;text-align:center"><b>📞 Customer Care</b><br><a href="tel:+919199428163" style="display:inline-block;margin-top:8px;color:#18a64a;font-weight:bold;font-size:18px;text-decoration:none">9199428163</a></div></section><div id="cart"><div class="sheet"><button onclick="closeCart()">Close ✕</button><h2>Your Cart 🛒</h2><div id="items"></div><h2>Total ₹<span id="total">0</span></h2><button style="width:100%" onclick="order()">Order on WhatsApp</button></div></div><script>
const P=[['Special Paan',38,'Paan','🍃'],['Meetha Paan',15,'Paan','🍃'],['Jarda Paan',15,'Paan','🍃'],['Cold Drink',40,'Drinks','🥤'],['Mineral Water',20,'Water','💧'],['Ice Cream',30,'Ice Cream','🍦']].map((x,i)=>({id:i+1,n:x[0],p:x[1],c:x[2],e:x[3]}));let cart=[],cat='All';
function render(){let q=search.value.toLowerCase(),cs=['All',...new Set(P.map(x=>x.c))];cats.innerHTML=cs.map(c=>`<div class="cat" onclick="cat='${c}';render()">${c=='All'?'🛍️':P.find(x=>x.c==c).e}<br><small>${c}</small></div>`).join('');products.innerHTML=P.filter(x=>(cat=='All'||x.c==cat)&&x.n.toLowerCase().includes(q)).map(x=>`<div class="card"><div style="height:125px;background:#e8f7ec;border-radius:10px;font-size:55px;text-align:center;padding-top:30px">${x.e}</div><div class="name">${x.n}</div><div class="price">₹${x.p}</div><button class="add" onclick="add(${x.id})">ADD</button></div>`).join('');count.textContent=cart.reduce((s,x)=>s+x.q,0)}
function add(id){let x=cart.find(x=>x.id==id);x?x.q++:cart.push({id,q:1});render()}function openCart(){cartRender();document.getElementById('cart').style.display='flex'}function closeCart(){document.getElementById('cart').style.display='none'}function cartRender(){let t=0;items.innerHTML=cart.map(x=>{let p=P.find(p=>p.id==x.id);t+=p.p*x.q;return `<div class="row">${p.n}<span class="qty"><button onclick="change(${x.id},-1)">−</button> ${x.q} <button onclick="change(${x.id},1)">+</button></span></div>`}).join('')||'Cart empty';total.textContent=t}function change(id,d){let x=cart.find(x=>x.id==id);x.q+=d;if(x.q<1)cart=cart.filter(x=>x.id!=id);cartRender();render()}function order(){if(!cart.length)return alert('Cart empty');let tx=cart.map(x=>{let p=P.find(p=>p.id==x.id);return p.n+' x'+x.q}).join('\n');open('https://wa.me/918102856181?text='+encodeURIComponent('Baba Pan Dukan Order\n'+tx))}render();
</script></body></html>
