<!doctype html>
<html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baba Pan Dukan | Online Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{position:sticky;top:0;z-index:10;background:#fff;padding:12px 16px;border-bottom:1px solid #ddd;display:flex;gap:12px;align-items:center}
.logo{font-size:20px;font-weight:800;color:#128a3b}.search{flex:1;padding:12px;border:1px solid #ddd;border-radius:10px}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:bold;cursor:pointer}.green{background:#128a3b;color:#fff}
.hero{padding:28px 16px;background:#e7f7ed}.hero h1{margin:0 0 8px}.cats{display:flex;overflow:auto;gap:10px;padding:14px;background:#fff}.cats button{white-space:nowrap;background:#eee}
.grid{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 1px 5px #0001}.card img{width:100%;height:130px;object-fit:cover;border-radius:10px;background:#eee}.card h3{font-size:15px;margin:9px 0}.price{font-weight:800;font-size:17px}.card button{width:100%;margin-top:9px;background:#128a3b;color:white}
.drawer{position:fixed;inset:0;background:#0008;z-index:20;display:flex;justify-content:flex-end}.panel{background:#fff;width:min(480px,100%);height:100%;padding:18px;overflow:auto}.hidden{display:none}.row{display:flex;justify-content:space-between;align-items:center;background:#f7f7f7;padding:10px;border-radius:10px;margin:8px 0;gap:8px}.qty button{padding:5px 10px}.input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:9px}
</style></head><body>
<header><div class="logo">🟢 Baba Pan Dukan</div><input id="search" class="search" placeholder="Search products..." oninput="render()"><button class="green" onclick="openCart()">🛒 <span id="count">0</span></button></header>
<section class="hero"><h1>Fast Local Delivery ⚡</h1><div>Paan • Cold Drink • Ice Cream • Water • General Store</div></section>
<div class="cats" id="cats"></div><main class="grid" id="products"></main>

<div class="drawer hidden" id="cart"><div class="panel"><button onclick="closeCart()">✕ Close</button><h2>Your Cart</h2><div id="cartItems"></div><h2>Total: ₹<span id="total">0</span></h2>
<input class="input" id="name" placeholder="Your Name"><input class="input" id="phone" placeholder="Mobile Number"><input class="input" id="address" placeholder="Delivery Address">
<button class="green" style="width:100%" onclick="checkout()">Order on WhatsApp</button></div></div>

<script>
const defaults=[
{id:1,n:"Special Paan",p:38,c:"Paan",s:50,img:"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=600&q=80"},
{id:2,n:"Meetha Paan",p:15,c:"Paan",s:50,img:"https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=600&q=80"},
{id:3,n:"Jarda Paan",p:15,c:"Paan",s:50,img:"https://images.unsplash.com/photo-1598514982901-ae627c8f9c6a?auto=format&fit=crop&w=600&q=80"},
{id:4,n:"Cold Drink",p:40,c:"Cold Drink",s:30,img:"https://images.unsplash.com/photo-1629203851122-3726ecdf080e?auto=format&fit=crop&w=600&q=80"},
{id:5,n:"Mineral Water",p:20,c:"Water",s:40,img:"https://images.unsplash.com/photo-1564419320461-6870880221ad?auto=format&fit=crop&w=600&q=80"},
{id:6,n:"Ice Cream",p:30,c:"Ice Cream",s:20,img:"https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=600&q=80"}];
let products=JSON.parse(localStorage.getItem("bpd_products")||"null")||defaults;
let cart=JSON.parse(localStorage.getItem("bpd_cart")||"[]"),cat="All";
const save=()=>{localStorage.setItem("bpd_products",JSON.stringify(products));localStorage.setItem("bpd_cart",JSON.stringify(cart))}
function render(){
let q=search.value.toLowerCase(), cats=["All",...new Set(products.map(x=>x.c))];
document.getElementById("cats").innerHTML=cats.map(x=>`<button onclick="cat='${x}';render()">${x}</button>`).join("");
productsEl=products.filter(x=>(cat=="All"||x.c==cat)&&x.n.toLowerCase().includes(q));
document.getElementById("products").innerHTML=productsEl.map(x=>`<div class="card"><img src="${x.img}"><h3>${x.n}</h3><div class="price">₹${x.p}</div><small>${x.s>0?"In Stock":"Out of Stock"}</small><button ${x.s<1?"disabled":""} onclick="add(${x.id})">ADD</button></div>`).join("");
count.textContent=cart.reduce((a,x)=>a+x.q,0)}
function add(id){let x=cart.find(x=>x.id==id);if(x)x.q++;else cart.push({id,q:1});save();render()}
function openCart(){cartEl();cart.classList?.remove;document.getElementById("cart").classList.remove("hidden")}
function closeCart(){document.getElementById("cart").classList.add("hidden")}
function cartEl(){let t=0;document.getElementById("cartItems").innerHTML=cart.map(x=>{let p=products.find(p=>p.id==x.id);t+=p.p*x.q;return `<div class="row"><span>${p.n}<div class="qty"><button onclick="change(${x.id},-1)">−</button> ${x.q} <button onclick="change(${x.id},1)">+</button></div></span><b>₹${p.p*x.q}</b></div>`}).join("")||"Cart is empty";total.textContent=t}
function change(id,d){let x=cart.find(x=>x.id==id);x.q+=d;if(x.q<=0)cart=cart.filter(x=>x.id!=id);save();cartEl();render()}
function checkout(){let n=name.value,ph=phone.value,a=address.value;if(!cart.length||!n||!ph||!a)return alert("Cart aur customer details bhariye");let t=cart.map(x=>{let p=products.find(p=>p.id==x.id);return `${p.n} x ${x.q} = ₹${p.p*x.q}`}).join("\\n");let totalAmount=cart.reduce((s,x)=>s+products.find(p=>p.id==x.id).p*x.q,0);let orders=JSON.parse(localStorage.getItem("bpd_orders")||"[]");orders.push({id:Date.now(),name:n,phone:ph,address:a,items:cart,total:totalAmount,status:"New"});localStorage.setItem("bpd_orders",JSON.stringify(orders));window.open("https://wa.me/918102856181?text="+encodeURIComponent("Baba Pan Dukan Order\\n"+t+"\\nTotal: ₹"+totalAmount+"\\nName: "+n+"\\nMobile: "+ph+"\\nAddress: "+a));cart=[];save();render();closeCart()}
render();
</script></body></html>
