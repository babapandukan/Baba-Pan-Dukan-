<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baba Pan Dukan | Paan</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7f5;
  color:#172017;
  padding-bottom:85px;
}

header{
  background:#075b32;
  color:white;
  padding:20px 16px;
  border-radius:0 0 24px 24px;
  text-align:center;
}

.logo{
  width:70px;
  height:70px;
  border-radius:50%;
  background:white;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}

header h1{
  margin-top:10px;
  font-size:24px;
}

header p{
  margin-top:5px;
  opacity:.9;
}

.container{
  padding:18px 14px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 0 15px;
}

.section-title h2{
  font-size:21px;
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.product{
  background:white;
  border-radius:18px;
  padding:10px;
  box-shadow:0 3px 14px #00000012;
}

.product img{
  width:100%;
  height:145px;
  object-fit:cover;
  border-radius:14px;
  background:#e5eee8;
}

.product h3{
  font-size:16px;
  margin:10px 3px 4px;
}

.price{
  color:#08783d;
  font-weight:bold;
  font-size:18px;
  margin:0 3px 9px;
}

.add{
  width:100%;
  border:0;
  background:#08783d;
  color:white;
  padding:11px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.cart{
  position:fixed;
  bottom:15px;
  left:14px;
  right:14px;
  background:#075b32;
  color:white;
  padding:15px 18px;
  border-radius:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 5px 20px #0004;
  z-index:10;
}

.cart button{
  border:0;
  background:#ffd21c;
  color:#222;
  padding:10px 15px;
  border-radius:12px;
  font-weight:bold;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:20;
  padding:18px;
  overflow:auto;
}

.modal-box{
  background:white;
  max-width:500px;
  margin:20px auto;
  border-radius:22px;
  padding:20px;
}

.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #ddd;
}

.qty button{
  width:28px;
  height:28px;
  border:0;
  border-radius:8px;
  background:#08783d;
  color:white;
}

.total{
  font-size:20px;
  font-weight:bold;
  margin:18px 0;
}

input,textarea{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
}

.order-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#25d366;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.extra{
  margin-top:20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.extra a{
  text-decoration:none;
  text-align:center;
  padding:13px;
  border-radius:12px;
  font-weight:bold;
}

.call{
  background:#ffd21c;
  color:#222;
}

.feedback{
  background:#eee;
  color:#222;
}

@media(max-width:360px){
  .products{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🌿</div>
  <h1>Baba Pan Dukan</h1>
  <p>आपका स्वागत है 🙏</p>
  <small>📍 Mangobander, Bihar</small>
</header>

<div class="container">

  <div class="section-title">
    <h2>🌿 हमारा Paan</h2>
    <span id="cartCount">0 Items</span>
  </div>

  <div class="products">

    <div class="product">
      <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=600&q=80">
      <h3>Saada Paan</h3>
      <div class="price">₹10</div>
      <button class="add" onclick="addToCart('Saada Paan',10)">
        Add +
      </button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=600&q=80">
      <h3>Meetha Paan</h3>
      <div class="price">₹15</div>
      <button class="add" onclick="addToCart('Meetha Paan',15)">
        Add +
      </button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1577803645773-f96470509666?auto=format&fit=crop&w=600&q=80">
      <h3>Jarda Paan</h3>
      <div class="price">₹15</div>
      <button class="add" onclick="addToCart('Jarda Paan',15)">
        Add +
      </button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1585032226651-759b368d7246?auto=format&fit=crop&w=600&q=80">
      <h3>Special Paan</h3>
      <div class="price">₹38</div>
      <button class="add" onclick="addToCart('Special Paan',38)">
        Add +
      </button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1601050692737-4c9d8b6d5f6c?auto=format&fit=crop&w=600&q=80">
      <h3>Maghai Patta Paan</h3>
      <div class="price">₹20</div>
      <button class="add" onclick="addToCart('Maghai Patta Paan',20)">
        Add +
      </button>
    </div>

  </div>

  <div class="extra">
    <a class="call" href="tel:9199428163">📞 Customer Care</a>

    <a class="feedback"
       href="https://maps.app.goo.gl/XBmLuKjrRUUdSMeK7"
       target="_blank">
       ⭐ Feedback
    </a>
  </div>

</div>

<div class="cart">
  <div>🛒 <span id="bottomCount">0</span> Items</div>
  <button onclick="openCart()">View Cart</button>
</div>

<div class="modal" id="cartModal">

  <div class="modal-box">

    <button class="close" onclick="closeCart()">✕</button>

    <h2>🛒 आपका Cart</h2>

    <div id="cartItems"></div>

    <div class="total">
      Total: ₹<span id="total">0</span>
    </div>

    <h3>📦 Delivery Details</h3>

    <input id="name" placeholder="आपका नाम">
    <input id="phone" type="tel" placeholder="Mobile Number">
    <textarea id="address" rows="3"
      placeholder="पूरा Address — Mangobander"></textarea>

    <button class="order-btn" onclick="placeOrder()">
      💬 WhatsApp पर Order करें
    </button>

  </div>

</div>

<script>

let cart = [];

function addToCart(name,price){

  let item = cart.find(x => x.name === name);

  if(item){
    item.qty++;
  }else{
    cart.push({
      name:name,
      price:price,
      qty:1
    });
  }

  updateCart();

  alert(name + " cart में add हो गया ✅");
}

function updateCart(){

  let count = cart.reduce((sum,item)=>sum+item.qty,0);

  document.getElementById("cartCount").innerText =
    count + " Items";

  document.getElementById("bottomCount").innerText =
    count;
}

function openCart(){

  document.getElementById("cartModal").style.display="block";

  let box = document.getElementById("cartItems");

  box.innerHTML="";

  let total=0;

  cart.forEach((item,index)=>{

    total += item.price * item.qty;

    box.innerHTML += `
      <div class="cart-item">

        <div>
          <b>${item.name}</b><br>
          ₹${item.price} × ${item.qty}
        </div>

        <div class="qty">
          <button onclick="changeQty(${index},-1)">−</button>
          ${item.qty}
          <button onclick="changeQty(${index},1)">+</button>
        </div>

      </div>
    `;

  });

  document.getElementById("total").innerText=total;
}

function closeCart(){
  document.getElementById("cartModal").style.display="none";
}

function changeQty(index,value){

  cart[index].qty += value;

  if(cart[index].qty <= 0){
    cart.splice(index,1);
  }

  updateCart();
  openCart();
}

function placeOrder(){

  if(cart.length === 0){
    alert("Cart खाली है!");
    return;
  }

  let name =
    document.getElementById("name").value.trim();

  let phone =
    document.getElementById("phone").value.trim();

  let address =
    document.getElementById("address").value.trim();

  if(!name || !phone || !address){

    alert("कृपया Name, Mobile और Address भरें।");
    return;
  }

  let message =
    "🌿 *Baba Pan Dukan Order*%0A%0A";

  message += "👤 Name: " + name + "%0A";
  message += "📱 Mobile: " + phone + "%0A";
  message += "📍 Address: " + address + "%0A%0A";

  message += "🛒 *Order:*%0A";

  let total=0;

  cart.forEach(item=>{

    let subtotal =
      item.price * item.qty;

    total += subtotal;

    message +=
      "• " + item.name +
      " × " + item.qty +
      " = ₹" + subtotal + "%0A";

  });

  message +=
    "%0A💰 *Total: ₹" + total + "*";

  /*
    Baba Pan Dukan WhatsApp Order Number
    8102856181
  */

  let whatsapp =
    "https://wa.me/918102856181?text=" + message;

  window.open(whatsapp,"_blank");

}

</script>

</body>
</html>
