<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baba Pan Dukan Admin</title><style>
body{font-family:Arial;margin:0;background:#f5f5f5;padding:20px}input,button,select{padding:12px;margin:5px;border-radius:8px;border:1px solid #ddd}button{background:#128a3b;color:white;border:0;font-weight:bold}.box{background:white;padding:16px;border-radius:12px;margin:12px auto;max-width:900px}.hidden{display:none}.row{padding:12px;background:#f5f5f5;margin:8px 0;border-radius:9px;display:flex;justify-content:space-between;gap:10px}
</style></head><body><div class="box" id="login"><h2>🔐 Baba Pan Dukan Admin</h2><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><p>Demo password: baba123</p></div>
<div class="box hidden" id="dash"><h2>Admin Dashboard</h2><p>Products: <b id="pc"></b> | Orders: <b id="oc"></b></p><h3>Add Product</h3><input id="n" placeholder="Product Name"><input id="p" placeholder="Price" type="number"><input id="c" placeholder="Category"><input id="s" placeholder="Stock" type="number"><input id="img" placeholder="Image URL"><button onclick="add()">Add Product</button><h3>Products</h3><div id="plist"></div><h3>Orders</h3><div id="olist"></div></div>
<script>
function login(){if(pass.value=="baba123"){loginEl();}else alert("Wrong password")}function loginEl(){document.getElementById("login").classList.add("hidden");document.getElementById("dash").classList.remove("hidden");render()}
let products=JSON.parse(localStorage.getItem("bpd_products")||"[]"),orders=JSON.parse(localStorage.getItem("bpd_orders")||"[]");
function render(){products=JSON.parse(localStorage.getItem("bpd_products")||"[]");orders=JSON.parse(localStorage.getItem("bpd_orders")||"[]");pc.textContent=products.length;oc.textContent=orders.length;plist.innerHTML=products.map(x=>`<div class="row">${x.n} | ₹${x.p} | Stock ${x.s}<button onclick="del(${x.id})">Delete</button></div>`).join("");olist.innerHTML=orders.slice().reverse().map(x=>`<div class="row"><span>${x.name}<br>₹${x.total}<br>${x.phone}<br>${x.address}</span><select onchange="status(${x.id},this.value)"><option>${x.status||"New"}</option><option>Accepted</option><option>Preparing</option><option>Out for Delivery</option><option>Delivered</option></select></div>`).join("")}
function add(){if(!n.value||!p.value)return alert("Name aur price bhariye");products.push({id:Date.now(),n:n.value,p:+p.value,c:c.value||"General Store",s:+s.value||0,img:img.value||"https://via.placeholder.com/300"});localStorage.setItem("bpd_products",JSON.stringify(products));render()}
function del(id){products=products.filter(x=>x.id!=id);localStorage.setItem("bpd_products",JSON.stringify(products));render()}
function status(id,v){let x=orders.find(x=>x.id==id);x.status=v;localStorage.setItem("bpd_orders",JSON.stringify(orders))}
</script></body></html>
