<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up | Baba Pan Dukan</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><a class="brand" href="index.html"><span>BP</span><b>Baba Pan Dukan</b></a></header>
<main class="auth"><form id="signupForm" class="panel auth-card"><div class="logo-big">BP</div><h1>Create account</h1><p class="muted">Save your details for faster checkout.</p><label>Full Name<input id="signupName" required></label><label>Mobile Number<input id="signupMobile" inputmode="numeric" pattern="[0-9]{10}" required></label><label>Password<input id="signupPassword" type="password" minlength="4" required></label><button class="btn primary full">Sign Up</button><p>Already have an account? <a href="login.html">Login</a></p></form></main><script src="script.js"></script></body></html>
