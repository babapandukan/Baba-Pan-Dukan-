<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>कुल्फी कॉर्नर | आइसक्रीम मेन्यू</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF3E4;
    --cream-card:#FFFDF9;
    --plum:#3D1F3D;
    --raspberry:#E8437B;
    --pistachio:#7A9B3E;
    --mango:#F5B942;
    --line: rgba(61,31,61,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream);
    color:var(--plum);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  .wrap{max-width:480px; margin:0 auto; padding:0 20px;}

  header.hero{
    background:var(--plum);
    color:var(--cream);
    padding:36px 20px 46px;
    position:relative;
    overflow:hidden;
    border-bottom-left-radius:28px;
    border-bottom-right-radius:28px;
  }
  header.hero::before{
    content:"";
    position:absolute;
    top:-60px; right:-40px;
    width:180px; height:180px;
    border-radius:50%;
    background:var(--raspberry);
    opacity:0.35;
  }
  header.hero::after{
    content:"";
    position:absolute;
    bottom:-70px; left:-30px;
    width:150px; height:150px;
    border-radius:50%;
    background:var(--mango);
    opacity:0.25;
  }
  .hero-inner{position:relative; z-index:2; max-width:480px; margin:0 auto;}
  .shop-tag{
    font-size:13px;
    letter-spacing:0.3px;
    color:var(--mango);
    font-weight:600;
    margin-bottom:6px;
  }
  h1.shop-name{
    font-family:'Fredoka', sans-serif;
    font-size:34px;
    font-weight:700;
    line-height:1.1;
    margin-bottom:10px;
  }
  .hero-desc{
    font-size:14.5px;
    color:#EADFEA;
    line-height:1.5;
    max-width:340px;
  }

  .tabs{
    display:flex;
    gap:8px;
    margin:22px 0 18px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .tab{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:999px;
    background:var(--cream-card);
    border:1.5px solid var(--line);
    font-family:'Work Sans';
    font-size:13.5px;
    font-weight:600;
    color:var(--plum);
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    background:var(--plum);
    color:var(--cream);
    border-color:var(--plum);
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:28px;
  }
  .card{
    background:var(--cream-card);
    border-radius:18px;
    padding:12px 12px 12px;
    border:1px solid var(--line);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .photo-wrap{
    width:100%;
    aspect-ratio:1/0.95;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:10px;
    background:#f2ece0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .photo-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .flavor-name{
    font-family:'Fredoka';
    font-size:14.5px;
    font-weight:600;
    line-height:1.25;
    margin-bottom:2px;
  }
  .flavor-desc{
    font-size:11px;
    color:#7A5E7A;
    line-height:1.4;
    margin-bottom:10px;
    flex-grow:1;
  }
  .card-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .price{
    font-family:'Fredoka';
    font-weight:600;
    font-size:15px;
    color:var(--raspberry);
  }
  .like-btn{
    background:none;
    border:none;
    font-size:20px;
    cursor:pointer;
    line-height:1;
    padding:4px;
    transition:transform 0.15s ease;
  }
  .like-btn.liked{ transform:scale(1.15); }

  .fav-note{
    display:flex;
    align-items:center;
    gap:8px;
    background:#FBE4EC;
    border:1px solid rgba(232,67,123,0.25);
    color:var(--raspberry);
    font-size:13px;
    font-weight:500;
    padding:10px 14px;
    border-radius:12px;
    margin-bottom:20px;
  }

  footer{
    margin-top:10px;
    text-align:center;
    padding:24px 20px 4px;
    border-top:1px solid var(--line);
  }
  footer .shop-line{
    font-family:'Fredoka';
    font-weight:600;
    font-size:15px;
    margin-bottom:4px;
  }
  footer .addr{
    font-size:12.5px;
    color:#7A5E7A;
    line-height:1.5;
  }

  @media (min-width:520px){
    .grid{grid-template-columns:1fr 1fr 1fr;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner wrap">
    <div class="shop-tag">आपकी दुकान का नाम यहाँ</div>
    <h1 class="shop-name">कुल्फी कॉर्नर 🍦</h1>
    <p class="hero-desc">ताज़ी आइसक्रीम व कुल्फी — अपना पसंदीदा फ्लेवर चुनें और ❤️ पर टैप करके पसंद करें।</p>
  </div>
</header>

<div class="wrap">
  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="all">सभी</div>
    <div class="tab" data-cat="kulfi">कुल्फी</div>
    <div class="tab" data-cat="shahi">शाही कुल्फी</div>
    <div class="tab" data-cat="icecream">आइसक्रीम</div>
  </div>

  <div class="fav-note" id="favNote" style="display:none;">
    <span>❤️</span>
    <span id="favText">0 फ्लेवर पसंद किए गए</span>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <div class="shop-line">कुल्फी कॉर्नर</div>
    <div class="addr">आपका पता यहाँ लिखें<br>खुला: सुबह 11 बजे – रात 10 बजे<br>संपर्क: 9XXXXXXXXX</div>
  </footer>
</div>

const grid = document.getElementById('grid');
const tabs = document.getElementById('tabs');
const favNote = document.getElementById('favNote');
const favText = document.getElementById('favText');

let liked = JSON.parse(localStorage.getItem('icecream_likes') || '[]');
let activeCat = 'all';

function saveLikes(){
  localStorage.setItem('icecream_likes', JSON.stringify(liked));
  updateFavNote();
}

function updateFavNote(){
  if(liked.length > 0){
    favNote.style.display = 'flex';
    favText.textContent = liked.length + ' फ्लेवर पसंद किए गए';
  } else {
    favNote.style.display = 'none';
  }
}

function render(){
  grid.innerHTML = '';
  const list = activeCat === 'all' ? products : products.filter(p => p.cat === activeCat);
  list.forEach((p, idx) => {
    const isLiked = liked.includes(p.name);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="photo-wrap"><img src="${p.img}" alt="${p.name}" loading="lazy"></div>
      <div class="flavor-name">${p.name}</div>
      <div class="flavor-desc">${p.desc}</div>
      <div class="card-bottom">
        <div class="price">${p.price}</div>
        <button class="like-btn ${isLiked ? 'liked' : ''}" data-name="${p.name}">${isLiked ? '❤️' : '🤍'}</button>
      </div>
    `;
    grid.appendChild(card);
  });

  document.querySelectorAll('.like-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.name;
      if(liked.includes(name)){
        liked = liked.filter(x => x !== name);
      } else {
        liked.push(name);
      }
      saveLikes();
      render();
    });
  });
}

tabs.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeCat = tab.dataset.cat;
    render();
  });
});

updateFavNote();
render();
</script>

</body>
</html>
