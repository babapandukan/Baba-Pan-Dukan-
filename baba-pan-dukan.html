<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baba Pan Dukan | पान मेन्यू</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dark-green:#0F2E1D;
    --mid-green:#1C4A2E;
    --gold:#D4AF37;
    --gold2:#E4B94F;
    --maroon:#6E1423;
    --cream:#FFF8E7;
    --line: rgba(228,185,79,0.25);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--dark-green);
    background-image: radial-gradient(circle at 20% 0%, rgba(228,185,79,0.08), transparent 40%);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:30px;
  }
  .wrap{max-width:460px; margin:0 auto; padding:0 18px;}

  /* HEADER */
  header{
    padding:22px 18px 18px;
    text-align:center;
    position:relative;
  }
  .logo-img{
    width:92px; height:92px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--gold2);
    box-shadow:0 4px 18px rgba(0,0,0,0.4);
    margin-bottom:10px;
  }
  h1.shop-name{
    font-family:'Playfair Display', serif;
    font-size:26px;
    font-weight:700;
    color:var(--gold2);
    letter-spacing:0.3px;
  }
  .tagline{
    font-size:12.5px;
    color:#E8D9A8;
    margin-top:4px;
    letter-spacing:0.2px;
  }
  .addr-line{
    font-size:11.5px;
    color:#B8C9BC;
    margin-top:8px;
    line-height:1.5;
  }

  /* CART BUTTON */
  .cart-btn{
    position:fixed;
    top:16px; right:16px;
    background:var(--maroon);
    border:2px solid var(--gold2);
    color:var(--cream);
    width:46px; height:46px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    cursor:pointer;
    z-index:50;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  .cart-count{
    position:absolute;
    top:-4px; right:-4px;
    background:var(--gold2);
    color:var(--dark-green);
    font-size:11px;
    font-weight:700;
    width:20px; height:20px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }

  /* CARD STACK */
  .stage{
    position:relative;
    height:420px;
    margin:22px 0 14px;
    touch-action:pan-y;
  }
  .card{
    position:absolute;
    inset:0;
    background:linear-gradient(160deg, #16391F, #0F2E1D);
    border:1.5px solid var(--line);
    border-radius:24px;
    padding:26px 22px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,0.45);
    transition:transform 0.28s ease, opacity 0.28s ease;
    user-select:none;
    cursor:grab;
  }
  .card.dragging{ transition:none; cursor:grabbing; }
  .icon-circle{
    width:130px; height:130px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:58px;
    margin-bottom:18px;
    box-shadow: inset 0 0 0 3px rgba(228,185,79,0.35);
  }
  .item-name{
    font-family:'Playfair Display', serif;
    font-size:23px;
    font-weight:700;
    color:var(--gold2);
    margin-bottom:8px;
  }
  .item-desc{
    font-size:13px;
    color:#D9E2DA;
    line-height:1.55;
    margin-bottom:16px;
    max-width:280px;
  }
  .item-price{
    font-family:'Playfair Display', serif;
    font-size:22px;
    font-weight:700;
    color:var(--cream);
    margin-bottom:20px;
  }
  .like-btn{
    background:var(--maroon);
    border:2px solid var(--gold2);
    color:var(--cream);
    padding:10px 26px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    font-family:'Work Sans';
    cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .like-btn.added{
    background:var(--gold2);
    color:var(--dark-green);
    border-color:var(--gold2);
  }
  .heart-ic{ font-size:17px; }

  /* NAV */
  .nav-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin-bottom:8px;
  }
  .nav-btn{
    width:42px; height:42px;
    border-radius:50%;
    background:var(--mid-green);
    border:1.5px solid var(--line);
    color:var(--gold2);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .dots{
    display:flex;
    gap:6px;
  }
  .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:rgba(228,185,79,0.3);
  }
  .dot.active{ background:var(--gold2); width:16px; border-radius:4px; }

  .swipe-hint{
    text-align:center;
    font-size:11.5px;
    color:#A6B7AA;
    margin-bottom:20px;
  }

  footer{
    text-align:center;
    padding:18px 20px 4px;
    border-top:1px solid var(--line);
    margin-top:10px;
  }
  footer .addr{
    font-size:11.5px;
    color:#A6B7AA;
    line-height:1.6;
  }
  footer .heart-line{ color:var(--gold2); margin-top:6px; font-size:12px; }

  /* CART MODAL */
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.6);
    z-index:100;
    display:none;
    align-items:flex-end;
  }
  .overlay.open{ display:flex; }
  .sheet{
    background:var(--dark-green);
    border-top:2px solid var(--gold2);
    border-radius:22px 22px 0 0;
    width:100%;
    max-width:460px;
    margin:0 auto;
    padding:20px 20px 26px;
    max-height:78vh;
    overflow-y:auto;
  }
  .sheet-title{
    font-family:'Playfair Display';
    font-size:19px;
    color:var(--gold2);
    font-weight:700;
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .close-x{ font-size:20px; cursor:pointer; color:#D9E2DA; }
  .cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .cart-item .ci-name{ color:var(--cream); font-weight:500; }
  .cart-item .ci-price{ color:var(--gold2); font-weight:600; margin-left:10px; }
  .remove-x{
    background:none; border:none; color:#C77;
    font-size:13px; cursor:pointer; margin-left:10px;
  }
  .cart-empty{
    text-align:center;
    color:#A6B7AA;
    font-size:13.5px;
    padding:26px 10px;
  }
  .cart-total{
    display:flex;
    justify-content:space-between;
    font-family:'Playfair Display';
    font-size:17px;
    font-weight:700;
    color:var(--cream);
    margin:14px 0 16px;
    padding-top:10px;
    border-top:1.5px solid var(--gold2);
  }
  .wa-btn{
    width:100%;
    background:#25D366;
    color:#0b3d1f;
    border:none;
    padding:14px;
    border-radius:14px;
    font-size:15px;
    font-weight:700;
    font-family:'Work Sans';
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .wa-btn[disabled]{ opacity:0.4; }
</style>
</head>

  {id:8, name:"फायर पान", desc:"स्पेशल फ्लेवर के साथ धुआं छोड़ता मैजिक पान", price:80, emoji:"🔥", bg:"#5C2A1E"},
  {id:9, name:"गुलकंद पान", desc:"ताज़े गुलकंद और गुलाब की पंखुड़ियों वाला पान", price:35, emoji:"🌹", bg:"#5C1E3A"},
];

const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const cartBtn = document.getElementById('cartBtn');
const cartCount = document.getElementById('cartCount');
const overlay = document.getElementById('overlay');
const closeCart = document.getElementById('closeCart');
const cartList = document.getElementById('cartList');
const cartTotal = document.getElementById('cartTotal');
const totalAmt = document.getElementById('totalAmt');
const waBtn = document.getElementById('waBtn');

let current = 0;
let cart = JSON.parse(localStorage.getItem('paan_cart') || '[]');
const WHATSAPP_NUMBER = "918102856181";

function saveCart(){
  localStorage.setItem('paan_cart', JSON.stringify(cart));
  updateCartUI();
}

function updateCartUI(){
  if(cart.length > 0){
    cartCount.style.display = 'flex';
    cartCount.textContent = cart.length;
  } else {
    cartCount.style.display = 'none';
  }
}

function renderDots(){
  dotsEl.innerHTML = '';
  products.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === current ? ' active' : '');
    dotsEl.appendChild(d);
  });
}

function renderCard(){
  stage.innerHTML = '';
  const p = products[current];
  const inCart = cart.some(c => c.id === p.id);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="icon-circle" style="background:${p.bg}">${p.emoji}</div>
    <div class="item-name">${p.name}</div>
    <div class="item-desc">${p.desc}</div>
    <div class="item-price">₹${p.price}</div>
    <button class="like-btn ${inCart ? 'added' : ''}" id="likeBtn">
      <span class="heart-ic">${inCart ? '❤️' : '🤍'}</span>
      <span>${inCart ? 'कार्ट में जोड़ा गया' : 'पसंद करें'}</span>
    </button>
  `;
  stage.appendChild(card);

  document.getElementById('likeBtn').addEventListener('click', () => {
    if(cart.some(c => c.id === p.id)){
      cart = cart.filter(c => c.id !== p.id);
    } else {
      cart.push({id:p.id, name:p.name, price:p.price});
    }
    saveCart();
    renderCard();
  });

  attachSwipe(card);
  renderDots();
}

function goTo(idx){
  current = (idx + products.length) % products.length;
  renderCard();
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

function attachSwipe(card){
  let startX = 0, deltaX = 0, dragging = false;

  function onDown(x){
    startX = x; dragging = true;
    card.classList.add('dragging');
  }
  function onMove(x){
    if(!dragging) return;
    deltaX = x - startX;
    card.style.transform = `translateX(${deltaX}px) rotate(${deltaX/24}deg)`;
    card.style.opacity = 1 - Math.min(Math.abs(deltaX)/300, 0.4);
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    if(deltaX > 80){
      goTo(current - 1);
    } else if(deltaX < -80){
      goTo(current + 1);
    } else {
      card.style.transform = '';
      card.style.opacity = 1;
    }
    deltaX = 0;
  }

  card.addEventListener('touchstart', e => onDown(e.touches[0].clientX));
  card.addEventListener('touchmove', e => onMove(e.touches[0].clientX));
  card.addEventListener('touchend', onUp);

  card.addEventListener('mousedown', e => onDown(e.clientX));
  window.addEventListener('mousemove', e => onMove(e.clientX));
  window.addEventListener('mouseup', onUp);
}

function renderCart(){
  cartList.innerHTML = '';
  if(cart.length === 0){
    cartList.innerHTML = '<div class="cart-empty">अभी कोई आइटम पसंद नहीं किया गया 🤍</div>';
    cartTotal.style.display = 'none';
    waBtn.disabled = true;
    return;
  }
  let total = 0;
  cart.forEach(item => {
    total += item.price;
    const row = document.createElement('div');
    row.className = 'cart-item';
    row.innerHTML = `
      <span class="ci-name">${item.name}</span>
      <span>
        <span class="ci-price">₹${item.price}</span>
        <button class="remove-x" data-id="${item.id}">हटाएं</button>
      </span>
    `;
    cartList.appendChild(row);
  });
  cartTotal.style.display = 'flex';
  totalAmt.textContent = '₹' + total;
  waBtn.disabled = false;

  cartList.querySelectorAll('.remove-x').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      cart = cart.filter(c => c.id !== id);
      saveCart();
      renderCart();
      renderCard();
    });
  });
}

cartBtn.addEventListener('click', () => {
  renderCart();
  overlay.classList.add('open');
});
closeCart.addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('open'); });

waBtn.addEventListener('click', () => {
  if(cart.length === 0) return;
  let msg = "नमस्ते Baba Pan Dukan! मुझे यह ऑर्डर करना है:\n\n";
  let total = 0;
  cart.forEach((item, i) => {
    msg += `${i+1}. ${item.name} - ₹${item.price}\n`;
    total += item.price;
  });
  msg += `\nकुल: ₹${total}`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
});

updateCartUI();
renderCard();
</script>

</body>
</html>
